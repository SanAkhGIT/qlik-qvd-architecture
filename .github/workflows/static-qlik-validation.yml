name: Static Qlik validation

on:
  push:
  pull_request:

jobs:
  qlik-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Qlik project structure
        run: python tests/validate_qlik_structure.py

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate deterministic QVD metadata fixture
        run: python python/generate_qvd_fixture.py --output artifacts/FactOrders.qvd --records 100

      - name: Run QVD metadata preflight
        run: |
          python python/qvd_preflight.py \
            --path artifacts/FactOrders.qvd \
            --contract config/qvd_metadata_contract.json \
            --min-records 1

      - name: Create QVD audit report
        if: always()
        run: |
          python python/qvd_audit.py \
            --path artifacts/FactOrders.qvd \
            --expected-fields config/qvd_metadata_contract.json \
            --json-out artifacts/qvd_audit.json \
            --csv-out artifacts/qvd_audit.csv

      - name: Upload QVD audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qvd-validation-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

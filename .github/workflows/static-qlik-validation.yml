name: Static Qlik validation

on:
  push:
  pull_request:

jobs:
  qlik-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Qlik project structure
        run: python tests/validate_qlik_structure.py

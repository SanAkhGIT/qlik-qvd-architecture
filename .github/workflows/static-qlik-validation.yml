name: Static Qlik validation

on:
  push:
  pull_request:

jobs:
  qlik-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Qlik project structure
        run: python tests/validate_qlik_structure.py

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run QVD metadata preflight
        run: |
          mkdir -p artifacts
          python python/qvd_preflight.py \
            --path qvd \
            --expected-fields config/qvd_metadata_contract.json \
            --json-out artifacts/qvd_preflight.json

      - name: Upload QVD audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qvd-validation-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
